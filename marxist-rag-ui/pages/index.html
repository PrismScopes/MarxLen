<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarxLen - 马列通</title>
    <meta name="description" content="基于马克思主义经典著作的 RAG 智能问答系统">

    <!-- 字体自托管前的过渡方案：预连接可省一次 TLS 握手 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- 设计令牌与组件样式，从原来的内联 <style> 拆出。
         用绝对路径 /assets/，由后端单独挂载该目录（见 api/main.py），
         并对该目录统一下发 no-cache 头，改完代码刷新即生效。 -->
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/app.css">

    <!--
      第三方库锁定版本，避免上游发布破坏性更新导致线上崩溃。
      DOMPurify 用于净化 Markdown 渲染结果（原版缺失，存在 XSS 风险）。
      注意：原来引入的 @tailwindcss/browser 已移除——
      它会在客户端实时编译 CSS，而全站只用到两条 @apply，得不偿失。
    -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js" defer></script>

    <script type="module" src="/assets/js/main.js"></script>
</head>
<body>

    <div class="chat-layout">

        <!-- 移动端抽屉遮罩 -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ============================================
             左侧边栏
             ============================================ -->
        <aside class="chat-sidebar" id="chatSidebar" aria-label="对话历史">

            <div class="chat-sidebar-header">
                <div class="sidebar-logo-main">MARXLEN</div>
                <div class="sidebar-logo-sub">马列通</div>
                <button class="new-chat-btn" type="button" id="newChatBtn">
                    <i data-lucide="plus"></i>
                    <span>新建对话</span>
                </button>
            </div>

            <!-- 历史列表由 history.js 动态填充 -->
            <div class="chat-history-section" id="historySection"></div>

            <div class="chat-sidebar-footer">
                <button class="sidebar-settings-btn" type="button" id="sidebarSettingsBtn" aria-label="设置">
                    <i data-lucide="settings"></i>
                    <span>设置</span>
                </button>
                <button class="sidebar-theme-btn" type="button" id="themeToggle" aria-label="切换主题" title="切换主题">
                    <i data-lucide="monitor"></i>
                </button>
                <button class="sidebar-toggle" type="button" id="sidebarToggle"
                        aria-label="收起侧边栏" aria-expanded="true" title="收起侧边栏">
                    <i data-lucide="panel-left-close"></i>
                </button>
            </div>
        </aside>

        <!-- ============================================
             主对话区
             ============================================ -->
        <main class="chat-main">

            <div class="chat-topbar">
                <div class="topbar-left">
                    <button class="hamburger-btn" type="button" id="hamburgerBtn" aria-label="打开侧边栏">
                        <i data-lucide="menu"></i>
                    </button>
                </div>
                <div class="topbar-right"></div>
            </div>

            <div class="chat-messages" id="chatMessages">

                <!-- 对话大纲，随内容滚动 -->
                <nav class="v-timeline" id="vTimeline" aria-label="对话大纲"></nav>

                <!-- 空态欢迎屏 -->
                <div class="welcome-container" id="welcomeContainer">
                    <div class="welcome-icon">
                        <!-- 品牌标志(新图形版)。颜色全部走 currentColor，由 .welcome-icon
                             统一着色，暗色模式才能跟着主题变 -->
                        <svg class="welcome-logo" viewBox="0 0 160 167" fill="none" aria-hidden="true">
                            <line x1="30.5149" y1="60.6196" x2="120.515" y2="150.62" stroke="currentColor" stroke-width="25"/>
                            <rect y="81.4591" width="63" height="28" transform="rotate(-44.71 0 81.4591)" fill="currentColor"/>
                            <path d="M44.7318 37.1778L75.6406 45.6277L64.3015 57.1826L52.9154 68.454L44.7318 37.1778Z" fill="currentColor"/>
                            <path d="M125.228 27.6456C134.279 33.6624 141.935 41.5505 147.678 50.7777C153.421 60.005 157.118 70.3567 158.52 81.1344C159.922 91.9121 158.996 102.865 155.804 113.255C152.613 123.644 147.23 133.228 140.019 141.36C132.809 149.492 123.937 155.983 114.005 160.394C104.072 164.806 93.3082 167.036 82.4402 166.934C71.5722 166.832 60.8525 164.4 51.0043 159.802C41.1562 155.204 32.4088 148.548 25.3522 140.281L40.2455 127.568C45.4839 133.704 51.9775 138.645 59.2882 142.058C66.5989 145.471 74.5565 147.277 82.6243 147.353C90.6921 147.429 98.6824 145.773 106.056 142.498C113.43 139.223 120.015 134.405 125.368 128.368C130.721 122.331 134.716 115.217 137.086 107.504C139.455 99.7918 140.142 91.6609 139.102 83.6602C138.061 75.6594 135.316 67.9749 131.053 61.1252C126.79 54.2754 121.107 48.4197 114.388 43.9532L125.228 27.6456Z" fill="currentColor"/>
                            <circle cx="119.676" cy="35.4584" r="10" fill="currentColor"/>
                            <rect x="95.6762" y="9.07912" width="20.661" height="33.9998" transform="rotate(-26.0677 95.6762 9.07912)" fill="currentColor"/>
                            <path d="M102.472 80.5388C108.794 88.6241 112.837 98.2545 114.181 108.43C115.525 118.606 114.121 128.955 110.114 138.405L92.898 131.105C95.6017 124.729 96.5493 117.745 95.6425 110.878C94.7357 104.012 92.0075 97.5135 87.7412 92.0575L102.472 80.5388Z" fill="currentColor"/>
                            <path d="M108.928 4.70515C101.17 6.14946 93.7919 9.17527 87.2536 13.5942C80.7154 18.0132 75.1567 23.7307 70.9237 30.3909L83.7565 38.5471C86.8701 33.6481 90.9589 29.4426 95.7681 26.1922C100.577 22.9418 106.004 20.7161 111.711 19.6537L108.928 4.70515Z" fill="currentColor"/>
                            <path d="M55.4919 12.5744L88.0958 20.1747L83.8344 38.4551L28.1761 21.9584L55.4919 12.5744Z" fill="currentColor"/>
                            <rect x="83.6761" y="56.6238" width="19" height="5" rx="2.5" transform="rotate(-25.4522 83.6761 56.6238)" fill="currentColor"/>
                        </svg>
                    </div>
                    <h1 class="welcome-title">马列通</h1>
                    <p class="welcome-subtitle">涵盖马克思、恩格斯、列宁、斯大林、毛泽东等经典著作的智能问答系统</p>
                </div>

                <!-- 消息流 -->
                <div class="conversation-container" id="conversationContainer" style="display:none;"></div>

            </div>

            <!-- ============================================
                 原文阅读器（左：书目录　中：书正文　右：检索窗口）
                 "原文查询"模式下取代消息区，但下方输入区保持可用：
                 划词可把原文送进输入框，再切到另外两个模式提问。
                 ============================================ -->
            <div class="reader-view" id="readerView" aria-label="原文阅读器">

                <!-- 左栏：书目录。书目态是文献列表，读某本书时换成该书目录 -->
                <div class="reader-sidebar" id="readerSidebar">
                    <div class="reader-sidebar-header">
                        <button class="reader-back-btn" type="button" id="readerBackBtn" aria-label="返回书目">
                            <i data-lucide="library"></i>
                            <span>书目</span>
                        </button>
                        <label for="readerFilter" class="sr-only">筛选书目或目录</label>
                        <input type="search" class="reader-filter" id="readerFilter"
                               placeholder="搜索书名 / 章节..." autocomplete="off">
                    </div>
                    <div class="reader-book-list" id="readerBookList"></div>
                    <div class="reader-toc" id="readerToc" aria-label="目录"></div>
                </div>

                <!-- 中栏：书正文 -->
                <div class="reader-main">
                    <div class="reader-header">
                        <button class="reader-pane-toggle" type="button" id="readerTocToggle"
                                aria-label="收起/展开书目录" title="收起/展开书目录">
                            <i data-lucide="panel-left"></i>
                        </button>
                        <h2 class="reader-title" id="readerTitle">原文书目</h2>
                        <button class="reader-pane-toggle" type="button" id="readerSearchToggle"
                                aria-label="收起/展开检索窗口" title="收起/展开检索窗口">
                            <i data-lucide="panel-right"></i>
                        </button>
                    </div>
                    <div class="reader-status" id="readerStatus"></div>
                    <div class="reader-content" id="readerContent"></div>
                </div>

                <!-- 右栏：检索窗口。语义检索，结果可直接跳到正文位置 -->
                <div class="reader-search-pane" id="readerSearchPane" aria-label="检索窗口">
                    <div class="reader-search-header">
                        <div class="reader-search-box">
                            <i data-lucide="search"></i>
                            <label for="readerSearchInput" class="sr-only">在原文中检索</label>
                            <input type="search" class="reader-search-input" id="readerSearchInput"
                                   placeholder="描述你要找的内容..." autocomplete="off">
                        </div>
                        <!-- 范围默认跟着当前正在读的书走，可切到全部文献 -->
                        <div class="reader-scope" role="radiogroup" aria-label="检索范围">
                            <button class="reader-scope-btn active" type="button"
                                    data-scope="current" role="radio" aria-checked="true">当前书</button>
                            <button class="reader-scope-btn" type="button"
                                    data-scope="all" role="radio" aria-checked="false">全部文献</button>
                        </div>
                        <div class="reader-search-meta" id="readerSearchMeta"></div>
                    </div>
                    <div class="reader-search-results" id="readerSearchResults"></div>
                </div>

            </div>

            <!-- 划词后浮出的操作按钮，把选中原文送进下方输入框 -->
            <div class="reader-selection-tip" id="readerSelectionTip" hidden>
                <button class="reader-selection-btn" type="button" id="readerQuoteBtn">
                    <i data-lucide="quote"></i>
                    <span>添加到对话框</span>
                </button>
            </div>

            <!-- ============================================
                 底部输入区
                 ============================================ -->
            <div class="chat-input-area">
                <div class="chat-input-wrapper">

                    <div class="mode-switcher" id="modeSwitcher" role="tablist" aria-label="问答模式">
                        <div class="mode-tab active" data-mode="general" role="tab"
                             tabindex="0" aria-selected="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            <span>通用问答</span>
                        </div>
                        <div class="mode-tab" data-mode="methodology" role="tab"
                             tabindex="0" aria-selected="false">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2a5 5 0 0 1 5 5c0 2.76-2.24 5-5 5s-5-2.24-5-5a5 5 0 0 1 5-5z"/><path d="M9 12v4a3 3 0 0 0 6 0v-4"/></svg>
                            <span>马哲方法论</span>
                        </div>
                        <div class="mode-tab" data-mode="original" role="tab"
                             tabindex="0" aria-selected="false">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                            <span>原文查询</span>
                        </div>
                    </div>

                    <div class="mode-description" id="modeDescription">基于马克思主义理论回答一般问题</div>

                    <div class="chat-input-box">
                        <!-- 拖拽这里调整输入框高度：手柄放在顶部，
                             往上拖变高、往下拖收缩，方向与边界移动一致 -->
                        <div class="chat-resize-handle" id="chatResizeHandle"
                             role="separator" aria-label="拖拽调整输入框高度" title="拖拽调整高度"></div>
                        <!-- 划词引用的缩略卡片挂在这里，不占输入框正文 -->
                        <div class="chat-quote-bar" id="chatQuoteBar"></div>
                        <label for="chatTextarea" class="sr-only">输入你的问题</label>
                        <textarea
                            class="chat-textarea"
                            id="chatTextarea"
                            name="question"
                            placeholder="输入你的问题..."
                            rows="1"
                        ></textarea>

                        <div class="chat-input-toolbar">
                            <div class="feature-toggles">
                                <button class="feature-pill search" type="button" id="searchToggle"
                                        title="联网搜索" aria-pressed="false">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                    <span>联网搜索</span>
                                </button>
                            </div>

                            <!-- 模型与推理等级触发器(点击打开专用弹窗,见 #modelModalOverlay) -->
                            <div class="model-selector-wrapper">
                                <div class="model-selector" id="modelSelector" tabindex="0" role="button"
                                     aria-label="选择模型与推理等级" aria-haspopup="dialog" aria-expanded="false">
                                    <span class="model-selector-name" id="modelSelectorName">加载中...</span>
                                    <i data-lucide="chevron-down"></i>
                                </div>
                            </div>

                            <div class="toolbar-right">
                                <button class="stop-btn" type="button" id="stopBtn" aria-label="停止生成">
                                    <i data-lucide="square"></i>
                                </button>
                                <button class="send-btn" type="button" id="sendBtn" aria-label="发送">
                                    <i data-lucide="arrow-up"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="input-hint">此为AI与文献综合回答，请谨慎辨别</div>
                </div>
            </div>

        </main>
    </div>

    <!-- ============================================
         模型与推理等级弹窗(参考 DSH 的模型选择弹窗:
         「模型」与「推理等级」两个面板,触发器显示组合)
         ============================================ -->
    <div class="model-modal-overlay" id="modelModalOverlay">
        <div class="model-modal-panel" role="dialog" aria-modal="true" aria-labelledby="modelModalTitle">
            <div class="model-modal-header">
                <h3 class="model-modal-title" id="modelModalTitle">模型与推理等级</h3>
                <button class="model-modal-close" type="button" id="modelModalCloseBtn" aria-label="关闭">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="model-modal-body">
                <div class="model-modal-section">
                    <div class="model-modal-section-label">模型</div>
                    <div class="model-modal-list" id="modelModalModelList" role="listbox" aria-label="模型"></div>
                </div>
                <div class="model-modal-divider"></div>
                <div class="model-modal-section">
                    <div class="model-modal-section-label">推理等级</div>
                    <div class="model-modal-list" id="modelModalEffortList" role="listbox" aria-label="推理等级"></div>
                </div>
            </div>
            <div class="model-modal-footer">
                <span class="model-modal-hint">模型列表可在设置页的「可选模型列表」中编辑</span>
                <button class="model-modal-settings-btn" type="button" id="modelModalSettingsBtn">打开设置</button>
            </div>
        </div>
    </div>

    <!-- ============================================
         设置面板（双栏：左侧分类导航 + 右侧内容）
         ============================================ -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">

            <!-- 左栏：标题 + 分类导航 -->
            <div class="settings-sidebar">
                <div class="settings-sidebar-header">
                    <h2 id="settingsTitle">设置</h2>
                </div>
                <nav class="settings-nav" id="settingsNav" role="tablist" aria-orientation="vertical"
                     aria-label="设置分类"></nav>
            </div>

            <!-- 右栏：当前分类的标题 + 内容 -->
            <div class="settings-content">
                <div class="settings-content-header">
                    <div class="settings-content-heading">
                        <h3 class="settings-content-title" id="settingsContentTitle">加载中</h3>
                        <p class="settings-content-desc" id="settingsContentDesc"></p>
                    </div>
                    <button class="settings-close-btn" type="button" id="settingsCloseBtn" aria-label="关闭设置">
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <div class="settings-content-body" id="settingsPanelBody">
                    <p class="settings-loading">加载中...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ============================================
         原文阅读器（左侧书目/目录 + 右侧正文）
         作为"原文查询"模式的主视图内嵌在 chat-main 中，
         与 chat-messages / chat-input-area 互斥显示。
         ============================================ -->

</body>
</html>

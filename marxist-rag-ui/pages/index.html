        function toggleSourceDetail(card, sourceData) {
            // Check if there is already a detail panel for this card
            var existingPanel = card.querySelector('.source-detail-panel');
            if (existingPanel) {
                existingPanel.remove();
                return;
            }

            // Remove any other open detail panels
            document.querySelectorAll('.source-detail-panel').forEach(function(p) {
                p.remove();
            });

            var panel = document.createElement('div');
            panel.className = 'source-detail-panel visible';

            var excerptHtml = '<div class="detail-excerpt">' + escapeHtml(sourceData.excerpt || '') + '</div>';

            var metaHtml = '<div class="detail-meta">';
            if (sourceData.author) {
                metaHtml += '<span>作者: ' + escapeHtml(sourceData.author) + '</span>';
            }
            metaHtml += '<span>相关度: ' + (parseFloat(sourceData.score) || 0).toFixed(2) + '</span>';
            if (sourceData.source_url) {
                metaHtml += '<span><a href="' + escapeHtml(sourceData.source_url) + '" target="_blank" rel="noopener" style="color: var(--color-text-link);">查看原文</a></span>';
            }
            metaHtml += '</div>';

            var collapseBtn = document.createElement('button');
            collapseBtn.className = 'detail-collapse-btn';
            collapseBtn.type = 'button';
            collapseBtn.innerHTML = '<i data-lucide="chevron-up"></i> 收起';

            panel.innerHTML = excerptHtml + metaHtml;
            panel.appendChild(collapseBtn);

            collapseBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                panel.remove();
            });

            card.appendChild(panel);
            lucide.createIcons();
        }

        function appendMessageActions(messageRow, answerText) {
            var msgBody = messageRow.querySelector('.msg-body');

            var actionsDiv = document.createElement('div');
            actionsDiv.className = 'msg-actions';

            // Copy button
            var copyBtn = document.createElement('button');
            copyBtn.className = 'msg-action-btn';
            copyBtn.type = 'button';
            copyBtn.title = '复制';
            copyBtn.innerHTML = '<i data-lucide="copy"></i>';
            copyBtn.addEventListener('click', function() {
                navigator.clipboard.writeText(answerText).then(function() {
                    copyBtn.innerHTML = '<i data-lucide="check"></i>';
                    lucide.createIcons();
                    setTimeout(function() {
                        copyBtn.innerHTML = '<i data-lucide="copy"></i>';
                        lucide.createIcons();
                    }, 2000);
                }).catch(function() {
                    // Fallback
                    var ta = document.createElement('textarea');
                    ta.value = answerText;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    copyBtn.innerHTML = '<i data-lucide="check"></i>';
                    lucide.createIcons();
                    setTimeout(function() {
                        copyBtn.innerHTML = '<i data-lucide="copy"></i>';
                        lucide.createIcons();
                    }, 2000);
                });
            });

            // Regenerate button
            var regenBtn = document.createElement('button');
            regenBtn.className = 'msg-action-btn';
            regenBtn.type = 'button';
            regenBtn.title = '重新生成';
            regenBtn.innerHTML = '<i data-lucide="refresh-cw"></i>';
            regenBtn.addEventListener('click', function() {
                if (isStreaming) return;

                // Regenerate: remove last AI message and re-send the last user question
                var allRows = Array.from(conversationContainer.querySelectorAll('.message-row'));
                var lastUserRow = null;
                for (var i = allRows.length - 1; i >= 0; i--) {
                    if (allRows[i].classList.contains('user-message')) {
                        lastUserRow = allRows[i];
                        break;
                    }
                }
                if (!lastUserRow) return;

                // Remove everything after the last user message
                truncateAfter(lastUserRow);

                // Re-send without resetting conversation_id
                lastQuestion = getRowOriginalText(lastUserRow);
                sendMessage({skipUserMessage: true});
            });

            actionsDiv.appendChild(copyBtn);
            actionsDiv.appendChild(regenBtn);
            msgBody.appendChild(actionsDiv);
            lucide.createIcons();
        }

        function scrollToBottom(force) {
            // Only auto-scroll if user is already near the bottom (within 150px)
            // or if force=true (e.g. new message start)
            var atBottom = (chatMessages.scrollTop + chatMessages.clientHeight) >= (chatMessages.scrollHeight - 150);
            if (force || atBottom) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // ── Custom Dialog Helper ───────────────────────────
        function showInputDialog(options) {
            // options: { title, placeholder, defaultValue, confirmText, onConfirm, onCancel }
            return new Promise(function(resolve) {
                var overlay = document.createElement('div');
                overlay.className = 'inline-dialog-overlay';

                var dialog = document.createElement('div');
                dialog.className = 'inline-dialog';

                var header = document.createElement('div');
                header.className = 'inline-dialog-header';
                header.textContent = options.title || '请输入';

                var body = document.createElement('div');
                body.className = 'inline-dialog-body';

                var input = document.createElement('input');
                input.className = 'inline-dialog-input';
                input.type = 'text';
                input.placeholder = options.placeholder || '';
                input.value = options.defaultValue || '';

                body.appendChild(input);
                dialog.appendChild(header);
                dialog.appendChild(body);

                var footer = document.createElement('div');
                footer.className = 'inline-dialog-footer';

                var cancelBtn = document.createElement('button');
                cancelBtn.className = 'inline-dialog-btn cancel';
                cancelBtn.textContent = '取消';
                cancelBtn.addEventListener('click', function() {
                    overlay.remove();
                    if (options.onCancel) options.onCancel();
                    resolve(null);
                });

                var confirmBtn = document.createElement('button');
                confirmBtn.className = 'inline-dialog-btn confirm';
                confirmBtn.textContent = options.confirmText || '确定';
                confirmBtn.addEventListener('click', function() {
                    var val = input.value.trim();
                    overlay.remove();
                    if (val || options.allowEmpty) {
                        if (options.onConfirm) options.onConfirm(val);
                        resolve(val);
                    } else {
                        resolve(null);
                    }
                });

                footer.appendChild(cancelBtn);
                footer.appendChild(confirmBtn);
                dialog.appendChild(footer);
                overlay.appendChild(dialog);
                document.body.appendChild(overlay);

                input.focus();
                input.select();

                // Enter to confirm
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') confirmBtn.click();
                    if (e.key === 'Escape') cancelBtn.click();
                });

                // Click overlay to cancel
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) cancelBtn.click();
                });
            });
        }

            var currentFolderId = folderMap[conv.id] || null;
            var selectedFolderId = currentFolderId;

            var overlay = document.createElement('div');
            overlay.className = 'inline-dialog-overlay';

            var dialog = document.createElement('div');
            dialog.className = 'inline-dialog';

            var header = document.createElement('div');
            header.className = 'inline-dialog-header';
            header.textContent = '移动到分组';

            var body = document.createElement('div');
            body.className = 'inline-dialog-body';

            var pickerList = document.createElement('div');
            pickerList.className = 'folder-picker-list';

            // "移出分组" option
            var noneItem = document.createElement('div');
            noneItem.className = 'folder-picker-item' + (selectedFolderId === null ? ' selected' : '');
            noneItem.innerHTML = '<i data-lucide="corner-up-left"></i> 无分组';
            noneItem.addEventListener('click', function() {
                pickerList.querySelectorAll('.folder-picker-item').forEach(function(el) { el.classList.remove('selected'); });
                noneItem.classList.add('selected');
                selectedFolderId = null;
            });
            pickerList.appendChild(noneItem);

            folderList.forEach(function(folder) {
                var fi = document.createElement('div');
                fi.className = 'folder-picker-item' + (selectedFolderId === folder.id ? ' selected' : '');
                fi.innerHTML = '<i data-lucide="folder"></i> ' + escapeHtml(folder.name);
                fi.addEventListener('click', function() {
                    pickerList.querySelectorAll('.folder-picker-item').forEach(function(el) { el.classList.remove('selected'); });
                    fi.classList.add('selected');
                    selectedFolderId = folder.id;
                });
                pickerList.appendChild(fi);
            });

            body.appendChild(pickerList);
            dialog.appendChild(header);
            dialog.appendChild(body);

            var footer = document.createElement('div');
            footer.className = 'inline-dialog-footer';

            var cancelBtn = document.createElement('button');
            cancelBtn.className = 'inline-dialog-btn cancel';
            cancelBtn.textContent = '取消';

            var confirmBtn = document.createElement('button');
            confirmBtn.className = 'inline-dialog-btn confirm';
            confirmBtn.textContent = '确定';

            cancelBtn.addEventListener('click', function() { overlay.remove(); });
            confirmBtn.addEventListener('click', function() {
                if (selectedFolderId === null) {
                    delete folderMap[conv.id];
                } else {
                    folderMap[conv.id] = selectedFolderId;
                }
                localStorage.setItem('conv_folders', JSON.stringify(folderMap));
                overlay.remove();
                loadHistory();
            });

            footer.appendChild(cancelBtn);
            footer.appendChild(confirmBtn);
            dialog.appendChild(footer);
            overlay.appendChild(dialog);
            document.body.appendChild(overlay);
            lucide.createIcons();

            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) overlay.remove();
            });
        }

        async function renameConversation(convId, newTitle) {
            try {
                await fetch('/api/conversations/' + convId, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle }),
                });
                loadHistory();
            } catch (e) {
                console.error('重命名失败:', e);
            }
        }

            showFolderPickerDialog(conv);
        }

        function addNewFolder() {
            showInputDialog({
                title: '新建分组',
                placeholder: '请输入分组名称',
                confirmText: '创建',
                onConfirm: function(name) {
                    var folderList = JSON.parse(localStorage.getItem('folders') || '[]');
                    var newFolder = { id: 'f_' + Date.now(), name: name };
                    folderList.push(newFolder);
                    localStorage.setItem('folders', JSON.stringify(folderList));
                    loadHistory();
                }
            });
        }

        // ── Load History with Folders ─────────────────────
        async function loadHistory() {
            try {
                var resp = await fetch('/api/conversations?limit=50');
                var data = await resp.json();
                historySection.innerHTML = '';

                var folderMap = JSON.parse(localStorage.getItem('conv_folders') || '{}');
                var folderList = JSON.parse(localStorage.getItem('folders') || '[]');

                // Separate conversations into folders and ungrouped
                var folderConvs = {};  // folderId -> [conv, ...]
                var ungrouped = [];

                data.forEach(function(conv) {
                    var fid = folderMap[conv.id] || null;
                    if (fid && folderList.some(function(f) { return f.id === fid; })) {
                        if (!folderConvs[fid]) folderConvs[fid] = [];
                        folderConvs[fid].push(conv);
                    } else {
                        ungrouped.push(conv);
                    }
                });

                // Build DOM
                var docFrag = document.createDocumentFragment();

                // --- Group section ---
                var groupSection = document.createElement('div');
                groupSection.className = 'history-group-section';

                var groupHeader = document.createElement('div');
                groupHeader.className = 'history-group-header';

                var groupTitle = document.createElement('span');
                groupTitle.className = 'history-group-title';
                groupTitle.textContent = '对话分组';

                var addBtn = document.createElement('button');
                addBtn.className = 'history-group-add-btn';
                addBtn.type = 'button';
                addBtn.innerHTML = '<i data-lucide="plus"></i> 新分组';
                addBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    addNewFolder();
                });

                groupHeader.appendChild(groupTitle);
                groupHeader.appendChild(addBtn);
                groupSection.appendChild(groupHeader);

                // Render folders
                var hasFolders = false;
                folderList.forEach(function(folder) {
                    var convs = folderConvs[folder.id] || [];
                    var folderEl = document.createElement('div');
                    folderEl.className = 'history-folder';
                    folderEl.setAttribute('data-folder-id', folder.id);

                    var arrow = document.createElement('i');
                    arrow.className = 'folder-arrow';
                    arrow.setAttribute('data-lucide', 'chevron-right');

                    var icon = document.createElement('i');
                    icon.className = 'folder-icon';
                    icon.setAttribute('data-lucide', 'folder');

                    var nameSpan = document.createElement('span');
                    nameSpan.className = 'folder-name';
                    nameSpan.textContent = folder.name;

                    var countSpan = document.createElement('span');
                    countSpan.className = 'folder-count';
                    countSpan.textContent = convs.length;

                    folderEl.appendChild(arrow);
                    folderEl.appendChild(icon);
                    folderEl.appendChild(nameSpan);
                    folderEl.appendChild(countSpan);

                    var childrenDiv = document.createElement('div');
                    childrenDiv.className = 'folder-children';

                    convs.forEach(function(conv) {
                        childrenDiv.appendChild(createHistoryItem(conv));
                    });

                    folderEl.appendChild(childrenDiv);

                    folderEl.addEventListener('click', function(e) {
                        if (e.target.closest('.folder-children') || e.target.closest('.history-item-more')) return;
                        folderEl.classList.toggle('open');
                    });

                    // Right-click or long-press to rename/delete folder
                    folderEl.addEventListener('contextmenu', function(e) {
                        e.preventDefault();
                        showFolderContextMenu(folderEl, folder, folderList, folderMap);
                    });

                    groupSection.appendChild(folderEl);
                    hasFolders = true;
                });

                if (!hasFolders) {
                    var emptyHint = document.createElement('div');
                    emptyHint.style.cssText = 'padding:4px 10px;font-size:11px;color:rgba(255,255,255,0.2);';
                    emptyHint.textContent = '暂无分组';
                    groupSection.appendChild(emptyHint);
                }

                docFrag.appendChild(groupSection);

                // --- Recent conversations (ungrouped) ---
                var recentLabel = document.createElement('div');
                recentLabel.className = 'history-time-group';
                recentLabel.textContent = '最近对话';
                docFrag.appendChild(recentLabel);

                ungrouped.forEach(function(conv) {
                    docFrag.appendChild(createHistoryItem(conv));
                });

                historySection.appendChild(docFrag);
                lucide.createIcons();

            } catch (e) {
                console.error('加载历史失败:', e);
            }
        }

        function createHistoryItem(conv) {
            var item = document.createElement('div');
            item.className = 'history-item' + (conv.id === currentConversationId ? ' active' : '');

            var textSpan = document.createElement('span');
            textSpan.className = 'history-item-text';
            textSpan.textContent = conv.title || '无标题';

            var moreBtn = document.createElement('span');
            moreBtn.className = 'history-item-more';
            moreBtn.title = '更多操作';
            moreBtn.innerHTML = '<i data-lucide="ellipsis"></i>';

            item.appendChild(textSpan);
            item.appendChild(moreBtn);

            item.addEventListener('click', function(e) {
                if (e.target.closest('.history-item-more')) return;
                loadConversation(conv.id);
                if (window.innerWidth <= 768) closeSidebar();
            });

            moreBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                showHistoryContextMenu(moreBtn, conv);
            });

            item.setAttribute('data-conv-id', conv.id);
            return item;
        }

        async function deleteConversation(convId) {
            try {
                await fetch('/api/conversations/' + convId, { method: 'DELETE' });
                // If the deleted conversation is the current one, reset to welcome
                if (convId === currentConversationId) {
                    newChat();
                }
                loadHistory();
            } catch (e) {
                console.error('删除对话失败:', e);
            }
        }

        // ── Thinking Content Persistence ──────────────────────
        function saveThinkingContent(convId, content) {
            try {
                var key = 'thinking_' + convId;
                // Keep only last 100 entries to avoid unbounded growth
                var stored = JSON.parse(localStorage.getItem(key) || '{}');
                var assistantMsgCount = 0;
                // Count current assistant messages
                var msgs = document.querySelectorAll('.assistant-bubble');
                assistantMsgCount = msgs.length;
                stored[assistantMsgCount] = content;
                // Clean old entries
                var keys = Object.keys(stored);
                if (keys.length > 100) {
                    keys.sort(function(a, b) { return parseInt(a) - parseInt(b); });
                    keys.slice(0, keys.length - 50).forEach(function(k) { delete stored[k]; });
                }
                localStorage.setItem(key, JSON.stringify(stored));
            } catch (e) { /* quota exceeded, ignore */ }
        }

        function getThinkingContents(convId) {
            try {
                return JSON.parse(localStorage.getItem('thinking_' + convId) || '{}');
            } catch (e) { return {}; }
        }

        function createThinkingProcessFromContent(content) {
            if (!content || !content.trim()) return null;
            var el = document.createElement('div');
            el.className = 'thinking-process visible';
            el.innerHTML =
                '<div class="thinking-process-header">' +
                '<i data-lucide="brain" class="thinking-process-icon" style="animation:none;"></i>' +
                '<span class="thinking-process-label">已深度思考</span>' +
                '<span class="thinking-process-duration"></span>' +
                '<i data-lucide="chevron-down" class="thinking-process-arrow"></i>' +
                '</div>' +
                '<div class="thinking-process-body">' + escapeHtml(content) + '</div>';
            el.querySelector('.thinking-process-header').addEventListener('click', function() {
                el.classList.toggle('open');
            });
            return el;
        }

        async function loadConversation(convId) {
            // 立即切换对话 ID，让正在生成的流知道已经切换了
            currentConversationId = convId;
            try {
                var resp = await fetch('/api/conversations/' + convId);
                var detail = await resp.json();

                lastQuestion = '';
                welcomeContainer.style.display = 'none';
                conversationContainer.style.display = 'block';
                conversationContainer.innerHTML = '';

                // Get saved thinking contents for this conversation
                var thinkingContents = getThinkingContents(convId);
                var assistantIdx = 0;

                detail.messages.forEach(function(msg) {
                    if (msg.role === 'user') {
                        appendUserMessage(msg.content);
                    } else if (msg.role === 'assistant') {
                        var row = createAssistantMessageElement();
                        var msgBubble = row.querySelector('.msg-bubble');
                        var msgText = row.querySelector('.msg-text');
                        msgText.innerHTML = renderMarkdown(msg.content || '');

                        // Restore thinking process if saved
                        var thinkContent = thinkingContents[String(assistantIdx)] || '';
                        if (thinkContent) {
                            var thinkEl = createThinkingProcessFromContent(thinkContent);
                            if (thinkEl) msgBubble.insertBefore(thinkEl, msgText);
                        }
                        assistantIdx++;

                        if (msg.sources && msg.sources.length > 0) {
                            appendSources(row, msg.sources);
                        }

                        // Add action buttons to loaded messages
                        if (msg.content) {
                            appendMessageActions(row, msg.content);
                        }

                        conversationContainer.appendChild(row);
                    }
                });

                // Highlight the matching history item
                document.querySelectorAll('.history-item').forEach(function(i) {
                    i.classList.remove('active');
                    if (i.getAttribute('data-conv-id') === convId) {
                        i.classList.add('active');
                    }
                });

                closeSidebar();
                scrollToBottom(true);
                lucide.createIcons();
                updateTimeline();
            } catch (e) {
                console.error('加载对话失败:', e);
            }
        }

        // ── Init ────────────────────────────────────────────
        (async function init() {
            sendBtn.disabled = true;
            await loadModels();
            loadHistory();
            // Apply saved thinking mode
            if (thinkingMode && thinkingToggle) {
                thinkingToggle.classList.add('active');
                thinkingToggle.title = '关闭深度思考';
                updateModeDescription();
            }
        })();
    </script>

</body>
</html>

    <style id="theme-vars">
/* ============================================
   Marxist RAG Knowledge Base - Brand Design System
   Theme: Advanced Red + White (Marxist Theory)
   Tone: Editorial / Academic / Solemn
   ============================================ */

:root {
  /* --- Primary Color System --- */
  --color-primary: #8B1A1A;
  --color-primary-light: #A52828;
  --color-primary-lighter: #C44040;
  --color-primary-dark: #6B1010;
  --color-primary-darker: #4A0A0A;
  --color-primary-50: rgba(139, 26, 26, 0.05);
  --color-primary-100: rgba(139, 26, 26, 0.10);
  --color-primary-200: rgba(139, 26, 26, 0.20);
  --color-primary-500: rgba(139, 26, 26, 0.50);
  --color-primary-700: rgba(139, 26, 26, 0.70);
  --color-primary-900: rgba(139, 26, 26, 0.90);

  /* --- Neutral Color System --- */
  --color-bg: #FFFFFF;
  --color-bg-secondary: #F9F7F5;
  --color-bg-tertiary: #F3F0EC;
  --color-bg-elevated: #FFFFFF;
  --color-surface: #FFFFFF;
  --color-surface-secondary: #F5F2EE;
  --color-border: #E8E2DA;
  --color-border-light: #F0ECE6;
  --color-border-dark: #D1C9BE;
  --color-text-primary: #1A1410;
  --color-text-secondary: #5C5347;
  --color-text-tertiary: #8A8078;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;
  --color-text-link: #8B1A1A;
  --color-text-link-hover: #6B1010;

  /* --- State Colors --- */
  --state-success: #2D6A4F;
  --state-warning: #B45309;
  --state-error: #B91C1C;
  --state-info: #1E5A8A;

  /* --- Typography System --- */
  --font-family-title: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', Georgia, serif;
  --font-family-body: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  --font-size-display: 2.5rem;
  --font-size-h1: 2rem;
  --font-size-h2: 1.5rem;
  --font-size-h3: 1.25rem;
  --font-size-h4: 1.125rem;
  --font-size-body: 0.9375rem;
  --font-size-body-sm: 0.875rem;
  --font-size-caption: 0.75rem;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.6;
  --line-height-relaxed: 1.8;
  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.05em;

  /* --- Radius System --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Spacing System --- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;
  --space-24: 6rem;

  /* --- Shadow System (static alpha <= 0.05) --- */
  --shadow-sm: 0 1px 2px rgba(26, 20, 16, 0.04);
  --shadow-md: 0 2px 8px rgba(26, 20, 16, 0.05);
  --shadow-lg: 0 8px 24px rgba(26, 20, 16, 0.05);
  --shadow-float: 0 12px 40px rgba(26, 20, 16, 0.10);
  --shadow-none: none;

  /* --- Transition --- */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}

/* --- Dark Mode --- */
.dark {
  --color-primary: #D44040;
  --color-primary-light: #E05555;
  --color-primary-lighter: #F07070;
  --color-primary-dark: #B83030;
  --color-primary-darker: #901818;
  --color-primary-50: rgba(212, 64, 64, 0.08);
  --color-primary-100: rgba(212, 64, 64, 0.15);
  --color-primary-200: rgba(212, 64, 64, 0.25);
  --color-primary-500: rgba(212, 64, 64, 0.55);
  --color-primary-700: rgba(212, 64, 64, 0.75);
  --color-primary-900: rgba(212, 64, 64, 0.92);

  --color-bg: #121010;
  --color-bg-secondary: #1A1816;
  --color-bg-tertiary: #222018;
  --color-bg-elevated: #1E1C1A;
  --color-surface: #1E1C1A;
  --color-surface-secondary: #262420;
  --color-border: #332E28;
  --color-border-light: #2A2620;
  --color-border-dark: #443E36;
  --color-text-primary: #F0ECE6;
  --color-text-secondary: #B5ADA2;
  --color-text-tertiary: #7A7268;
  --color-text-inverse: #121010;
  --color-text-on-primary: #FFFFFF;
  --color-text-link: #E05555;
  --color-text-link-hover: #F07070;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.20);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.30);
  --shadow-float: 0 12px 40px rgba(0, 0, 0, 0.40);
}

    <style type="text/tailwindcss">

    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

    <style>
      /* ============================================
         Chat Interface - Base Reset
         ============================================ */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-family-body);
        background-color: var(--color-bg);
        color: var(--color-text-primary);
        line-height: var(--line-height-normal);
      }

      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* ============================================
         Layout: Sidebar + Main
         ============================================ */
      .chat-layout {
        display: flex;
        height: 100vh;
        width: 100%;
      }

      /* ============================================
         Left Sidebar
         ============================================ */
      .chat-sidebar {
        width: 260px;
        min-width: 260px;
        height: 100vh;
        background-color: var(--color-primary-darker);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: transform var(--transition-normal), opacity var(--transition-normal);
        z-index: 40;
      }

      .chat-sidebar-header {
        padding: 20px 16px 12px 16px;
        flex-shrink: 0;
      }

      .sidebar-logo-main {
        font-family: var(--font-family-title);
        font-size: 1.125rem;
        font-weight: 700;
        color: #FFFFFF;
        letter-spacing: var(--letter-spacing-wide);
        line-height: 1.3;
      }

      .sidebar-logo-sub {
        font-family: var(--font-family-body);
        font-size: var(--font-size-caption);
        color: rgba(255, 255, 255, 0.55);
        font-weight: 400;
        line-height: 1.3;
        margin-top: 2px;
      }

      .new-chat-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        margin-top: 16px;
        padding: 10px 16px;
        background-color: var(--color-primary);
        color: var(--color-text-on-primary);
        border: none;
        border-radius: var(--radius-lg);
        font-family: var(--font-family-body);
        font-size: var(--font-size-body-sm);
        font-weight: var(--font-weight-medium);
        cursor: pointer;
        transition: background-color var(--transition-fast);
        flex-shrink: 0;
      }

      .new-chat-btn:hover {
        background-color: var(--color-primary-dark);
      }

      .new-chat-btn svg,
      .new-chat-btn i {
        width: 16px;
        height: 16px;
      }

      /* History section */
      .chat-history-section {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      }

      .chat-history-section::-webkit-scrollbar {
        width: 4px;
      }

      .chat-history-section::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat-history-section::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
      }

      /* ── Sidebar Folder Groups ─────────────────────────── */

      /* Group section header */
      .history-group-section {
        margin-bottom: 4px;
      }
      .history-group-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px 2px 10px;
      }
      .history-group-title {
        font-size: 11px;
        color: rgba(255,255,255,0.3);
        font-weight: var(--font-weight-medium);
        letter-spacing: 0.02em;
      }
      .history-group-add-btn {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 2px 8px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: var(--radius-sm);
        background: transparent;
        color: rgba(255,255,255,0.35);
        font-size: 11px;
        cursor: pointer;
        transition: all var(--transition-fast);
      }
      .history-group-add-btn:hover {
        color: rgba(255,255,255,0.6);
        border-color: rgba(255,255,255,0.2);
        background-color: rgba(255,255,255,0.06);
      }
      .history-group-add-btn svg, .history-group-add-btn i {
        width: 12px;
        height: 12px;
      }

      /* Folder row */
      .history-folder {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background-color var(--transition-fast);
        color: rgba(255,255,255,0.55);
        font-size: var(--font-size-body-sm);
      }
      .history-folder:hover {
        background-color: rgba(255,255,255,0.06);
        color: rgba(255,255,255,0.75);
      }
      .history-folder.open .folder-arrow {
        transform: rotate(90deg);
      }
      .folder-arrow {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
        transition: transform var(--transition-fast);
        opacity: 0.5;
      }
      .folder-icon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        opacity: 0.6;
      }
      .folder-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .folder-count {
        font-size: 10px;
        color: rgba(255,255,255,0.25);
        flex-shrink: 0;
      }
      .folder-children {
        padding-left: 18px;
        display: none;
      }
      .history-folder.open .folder-children {
        display: block;
      }

      /* Time group label (for ungrouped items) */
      .history-time-group {
        font-size: 11px;
        color: rgba(255,255,255,0.25);
        padding: 10px 10px 4px 10px;
        font-weight: var(--font-weight-medium);
      }

      /* History item (conversation row) */
      .history-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background-color var(--transition-fast);
        color: rgba(255,255,255,0.55);
        font-size: var(--font-size-body-sm);
        line-height: 1.4;
        position: relative;
      }
      .history-item:hover {
        background-color: rgba(255,255,255,0.06);
        color: rgba(255,255,255,0.8);
      }
      .history-item.active {
        background-color: rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.9);
      }
      .history-item-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }

      /* Three-dot menu trigger */
      .history-item-more {
        display: none;
        margin-left: auto;
        padding: 2px;
        color: rgba(255,255,255,0.3);
        cursor: pointer;
        flex-shrink: 0;
        border-radius: var(--radius-sm);
        transition: color var(--transition-fast);
      }
      .history-item:hover .history-item-more {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .history-item-more:hover {
        color: rgba(255,255,255,0.6);
      }
      .history-item-more svg, .history-item-more i {
        width: 14px;
        height: 14px;
      }

      /* Context dropdown menu */
      .ctx-menu {
        position: absolute;
        right: 4px;
        top: 100%;
        z-index: 300;
        min-width: 140px;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        padding: 4px 0;
        overflow: hidden;
      }
      .ctx-menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        font-size: 13px;
        color: var(--color-text-secondary);
        cursor: pointer;
        transition: all var(--transition-fast);
        white-space: nowrap;
      }
      .ctx-menu-item svg, .ctx-menu-item i {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .ctx-menu-item:hover {
        background-color: var(--color-bg-tertiary);
        color: var(--color-text-primary);
      }
      .ctx-menu-item.danger {
        color: #dc3545;
      }
      .ctx-menu-item.danger:hover {
        background-color: rgba(220,53,69,0.08);
        color: #b02a37;
      }
      .ctx-menu-sep {
        height: 1px;
        background-color: var(--color-border-light);
        margin: 3px 0;
      }

      /* Sidebar bottom */
      .chat-sidebar-footer {
        padding: 12px 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Sidebar collapse toggle */
      .sidebar-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: all var(--transition-fast);
        margin: 0 auto;
        flex-shrink: 0;
      }
      .sidebar-toggle:hover {
        color: rgba(255, 255, 255, 0.7);
        background-color: rgba(255, 255, 255, 0.08);
      }
      .sidebar-toggle svg, .sidebar-toggle i {
        width: 16px;
        height: 16px;
        transition: transform var(--transition-normal);
      }
      .sidebar-toggle.collapsed svg,
      .sidebar-toggle.collapsed i {
        transform: rotate(180deg);
      }

      /* When sidebar is collapsed, keep toggle visible outside */
      .chat-sidebar.collapsed .sidebar-toggle {
        position: fixed;
        left: 0;
        top: 50%;
        transform: translateY(-50%) rotate(0deg);
        width: 24px;
        height: 48px;
        background-color: var(--color-bg-secondary, #f5f5f5);
        color: var(--color-text-tertiary);
        border-radius: 0 var(--radius-md) var(--radius-md) 0;
        z-index: 200;
        opacity: 1;
        pointer-events: auto;
        box-shadow: 2px 0 8px rgba(0,0,0,0.06);
      }
      .chat-sidebar.collapsed .sidebar-toggle:hover {
        background-color: var(--color-bg-tertiary, #eee);
        color: var(--color-text-secondary);
      }
      .chat-sidebar.collapsed .sidebar-toggle svg,
      .chat-sidebar.collapsed .sidebar-toggle i {
        transform: rotate(0deg) !important;
      }

      /* Collapsed sidebar state */
      .chat-sidebar.collapsed {
        width: 0;
        min-width: 0;
        overflow: hidden;
        padding: 0;
      }
      .chat-sidebar.collapsed .chat-sidebar-header,
      .chat-sidebar.collapsed .chat-sidebar-history,
      .chat-sidebar.collapsed .chat-sidebar-footer > *:not(.sidebar-toggle) {
        opacity: 0;
        pointer-events: none;
      }



      .sidebar-settings-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        background: transparent;
        border: none;
        border-radius: var(--radius-md);
        color: rgba(255, 255, 255, 0.5);
        font-family: var(--font-family-body);
        font-size: var(--font-size-body-sm);
        cursor: pointer;
        transition: background-color var(--transition-fast), color var(--transition-fast);
      }

      .sidebar-settings-btn:hover {
        background-color: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.8);
      }

      .sidebar-settings-btn svg,
      .sidebar-settings-btn i {
        width: 16px;
        height: 16px;
      }

      /* ============================================
         Main Chat Area
         ============================================ */
      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-width: 0;
        background-color: var(--color-bg);
      }

      /* ============================================
         Top Bar
         ============================================ */
      .chat-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 52px;
        min-height: 52px;
        padding: 0 20px;
        border-bottom: 1px solid var(--color-border-light);
        background-color: var(--color-bg);
        flex-shrink: 0;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* Mobile hamburger */
      .hamburger-btn {
        display: none;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        border-radius: var(--radius-md);
        color: var(--color-text-secondary);
        cursor: pointer;
        transition: background-color var(--transition-fast);
      }

      .hamburger-btn:hover {
        background-color: var(--color-bg-tertiary);
      }

      .hamburger-btn svg,
      .hamburger-btn i {
        width: 20px;
        height: 20px;
      }

      /* Model selector (inside input box toolbar) */
      .model-selector-wrapper {
        position: relative;
      }

      .model-selector {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border: none;
        border-radius: var(--radius-md);
        background-color: transparent;
        cursor: pointer;
        transition: background-color var(--transition-fast);
        user-select: none;
      }

      .model-selector:hover {
        background-color: var(--color-bg-tertiary);
      }

      .model-selector:focus-within {
        background-color: var(--color-bg-tertiary);
      }

      .model-selector-name {
        font-family: var(--font-family-body);
        font-size: var(--font-size-caption);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-tertiary);
      }

      .model-selector svg,
      .model-selector i {
        width: 12px;
        height: 12px;
        color: var(--color-text-tertiary);
      }

      /* Model dropdown */
      .model-dropdown {
        display: none;
        position: absolute;
        bottom: 100%;
        left: 0;
        margin-bottom: var(--space-2);
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        min-width: 180px;
        z-index: 100;
        overflow: hidden;
      }
      .model-dropdown.open {
        display: block;
      }
      .model-dropdown-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-3) var(--space-4);
        cursor: pointer;
        font-size: var(--font-size-body-sm);
        color: var(--color-text-primary);
        transition: background-color var(--transition-fast);
      }
      .model-dropdown-item:hover {
        background-color: var(--color-bg-tertiary);
      }
      .model-dropdown-item.active {
        color: var(--color-primary);
        font-weight: var(--font-weight-medium);
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* ============================================
         Chat Messages Area
         ============================================ */
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        scrollbar-width: thin;
        scrollbar-color: var(--color-border) transparent;
        position: relative;
      }

      .chat-messages::-webkit-scrollbar {
        width: 6px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background-color: var(--color-border);
        border-radius: 3px;
      }

      .chat-messages::-webkit-scrollbar-thumb:hover {
        background-color: var(--color-border-dark);
      }

      /* Vertical Timeline - inside chat-messages, sticky */
      .v-timeline {
        position: sticky;
        top: 0;
        align-self: flex-start;
        width: 160px;
        min-width: 160px;
        max-height: calc(100vh - 160px);
        overflow-y: auto;
        padding: 16px 0;
        display: none;
        flex-shrink: 0;
        scrollbar-width: none;
        border-right: 1px solid var(--color-border-light);
      }
      .v-timeline::-webkit-scrollbar {
        display: none;
      }
      .v-timeline.visible {
        display: block;
      }
      .v-timeline-label {
        font-size: 10px;
        color: var(--color-text-tertiary);
        padding: 4px 12px 10px 12px;
        font-weight: var(--font-weight-medium);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .v-timeline-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        transition: background-color 0.15s ease;
        position: relative;
      }
      .v-timeline-item:hover {
        background-color: var(--color-bg-tertiary);
      }
      .v-timeline-item.active {
        background-color: var(--color-primary-50);
      }
      .v-timeline-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: var(--color-bg);
        border: 2px solid var(--color-border);
        flex-shrink: 0;
        margin-top: 3px;
        transition: all 0.2s ease;
        position: relative;
        z-index: 1;
      }
      .v-timeline-item:hover .v-timeline-dot {
        border-color: var(--color-text-tertiary);
      }
      .v-timeline-item.active .v-timeline-dot {
        background-color: var(--color-primary);
        border-color: var(--color-primary);
      }
      .v-timeline-text {
        font-size: 12px;
        color: var(--color-text-tertiary);
        line-height: 1.4;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        transition: color 0.15s ease;
        flex: 1;
        min-width: 0;
      }
      .v-timeline-item:hover .v-timeline-text {
        color: var(--color-text-secondary);
      }
      .v-timeline-item.active .v-timeline-text {
        color: var(--color-primary);
      }

      /* ============================================
         Message Rows & Bubbles
         ============================================ */
      .conversation-container {
        width: 100%;
        max-width: 780px;
        margin: 0 auto;
        padding: 24px 24px 32px 56px;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .message-row {
        padding: var(--space-4) 0;
      }

      .message-row.user-message {
        text-align: right;
      }
      .message-row.user-message .msg-text {
        display: inline-block;
        text-align: left;
        max-width: 80%;
        color: var(--color-text-secondary);
      }
      /* User message action bar (edit button, same style as AI msg-actions) */
      .user-msg-actions {
        display: flex;
        gap: var(--space-1);
        margin-top: var(--space-3);
        justify-content: flex-end;
        opacity: 0;
        transition: opacity var(--transition-fast);
      }
      .message-row:hover .user-msg-actions {
        opacity: 1;
      }

      /* User message editing mode */
      .message-row.user-message.editing {
        text-align: left;
      }
      .message-row.user-message.editing .msg-text {
        max-width: 100%;
        color: var(--color-text-primary);
        display: block;
      }
      .message-row.user-message.editing .msg-bubble {
        display: block;
      }
      .msg-edit-area {
        width: 100%;
        min-height: 40px;
        max-height: 200px;
        padding: 8px 12px;
        border: 1px solid var(--color-primary);
        border-radius: var(--radius-md);
        background-color: var(--color-surface);
        font-family: var(--font-family-body);
        font-size: var(--font-size-body);
        color: var(--color-text-primary);
        line-height: var(--line-height-normal);
        resize: none;
        outline: none;
        box-sizing: border-box;
      }
      .msg-edit-area::placeholder {
        color: var(--color-text-tertiary);
      }
      .msg-edit-actions {
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-2);
        justify-content: flex-end;
      }
      .msg-edit-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 14px;
        border: none;
        border-radius: var(--radius-md);
        font-size: var(--font-size-body-sm);
        cursor: pointer;
        transition: all var(--transition-fast);
      }
      .msg-edit-btn.primary {
        background-color: var(--color-primary);
        color: var(--color-text-on-primary);
      }
      .msg-edit-btn.primary:hover {
        background-color: var(--color-primary-dark);
      }
      .msg-edit-btn.secondary {
        background-color: var(--color-bg-tertiary);
        color: var(--color-text-secondary);
      }
      .msg-edit-btn.secondary:hover {
        background-color: var(--color-border);
      }

      .message-row.assistant-message .msg-text {
        max-width: 100%;
        color: var(--color-text-primary);
      }

      /* Thin separator between message pairs */
      .message-row + .message-row.user-message {
        border-top: 1px solid var(--color-border-light);
      }

      .msg-body {
        max-width: 100%;
      }

      .msg-bubble {
        padding: 0;
        border-radius: 0;
        background: transparent;
        font-size: var(--font-size-body);
        line-height: var(--line-height-relaxed);
        word-break: break-word;
      }

      .msg-text {
        /* container for rendered markdown */
      }

      /* Markdown rendered content - comprehensive styling */
      .msg-text p {
        margin-bottom: var(--space-3);
        line-height: var(--line-height-relaxed);
      }
      .msg-text p:last-child {
        margin-bottom: 0;
      }
      .msg-text strong {
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
      }
      .msg-text em {
        font-style: italic;
      }
      .msg-text h1, .msg-text h2, .msg-text h3, .msg-text h4 {
        font-family: var(--font-family-title);
        color: var(--color-text-primary);
        margin-top: var(--space-6);
        margin-bottom: var(--space-3);
        font-weight: var(--font-weight-semibold);
        line-height: var(--line-height-tight);
      }
      .msg-text h1 { font-size: var(--font-size-h1); }
      .msg-text h2 { font-size: var(--font-size-h2); }
      .msg-text h3 { font-size: var(--font-size-h3); }
      .msg-text h4 { font-size: var(--font-size-h4); }
      .msg-text h1:first-child, .msg-text h2:first-child, .msg-text h3:first-child, .msg-text h4:first-child {
        margin-top: 0;
      }
      .msg-text ol, .msg-text ul {
        margin: var(--space-3) 0;
        padding-left: 1.5rem;
      }
      .msg-text ol {
        list-style-type: decimal;
      }
      .msg-text ul {
        list-style-type: disc;
      }
      .msg-text li {
        margin-bottom: var(--space-2);
        line-height: var(--line-height-relaxed);
      }
      .msg-text li:last-child {
        margin-bottom: 0;
      }
      .msg-text li > p {
        margin-bottom: var(--space-1);
      }
      .msg-text blockquote {
        margin: var(--space-4) 0;
        padding: var(--space-3) var(--space-4);
        border-left: 3px solid var(--color-primary);
        background-color: var(--color-primary-50);
        color: var(--color-text-secondary);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      }
      .msg-text blockquote p:last-child {
        margin-bottom: 0;
      }
      .msg-text code {
        font-family: var(--font-family-mono);
        font-size: 0.875em;
        padding: 0.15em 0.4em;
        background-color: var(--color-bg-tertiary);
        border-radius: var(--radius-sm);
        color: var(--color-text-primary);
      }
      .msg-text pre {
        margin: var(--space-4) 0;
        padding: var(--space-4);
        background-color: var(--color-bg-secondary);
        border: 1px solid var(--color-border-light);
        border-radius: var(--radius-md);
        overflow-x: auto;
      }
      .msg-text pre code {
        padding: 0;
        background: transparent;
        font-size: var(--font-size-body-sm);
        line-height: var(--line-height-normal);
      }
      .msg-text hr {
        border: none;
        border-top: 1px solid var(--color-border-light);
        margin: var(--space-6) 0;
      }
      .msg-text a {
        color: var(--color-text-link);
        text-decoration: none;
      }
      .msg-text a:hover {
        color: var(--color-text-link-hover);
        text-decoration: underline;
      }
      .msg-text table {
        width: 100%;
        border-collapse: collapse;
        margin: var(--space-4) 0;
        font-size: var(--font-size-body-sm);
      }
      .msg-text th, .msg-text td {
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--color-border);
        text-align: left;
      }
      .msg-text th {
        background-color: var(--color-bg-secondary);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
      }

      /* Thinking / Retrieval Steps */
      .thinking-steps {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 4px 0;
      }
      .thinking-step {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--font-size-body-sm);
        color: var(--color-text-tertiary);
        opacity: 0.4;
        transition: opacity 0.3s ease;
      }
      .thinking-step.active {
        opacity: 1;
        color: var(--color-text-secondary);
      }
      .thinking-step.done {
        opacity: 0.6;
      }
      .thinking-step-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .thinking-step.active .thinking-step-icon {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .thinking-step.done .thinking-step-icon {
        color: var(--color-primary);
      }
      .thinking-step .step-text {
        line-height: 1.4;
      }
      .thinking-step.active .step-text::after {
        content: '';
        display: inline-block;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background-color: var(--color-text-secondary);
        margin-left: 4px;
        animation: blink-dot 1s ease-in-out infinite;
        vertical-align: middle;
      }
      @keyframes blink-dot {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      /* ============================================
         Source Cards
         ============================================ */
      .sources-section {
        margin-top: var(--space-4);
        border-top: 1px solid var(--color-border-light);
        padding-top: var(--space-4);
      }

      .sources-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        user-select: none;
        margin-bottom: var(--space-3);
      }

      .sources-header-label {
        font-size: var(--font-size-caption);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .sources-header svg,
      .sources-header i {
        width: 14px;
        height: 14px;
        color: var(--color-text-tertiary);
        transition: transform var(--transition-fast);
      }

      .sources-header.expanded svg,
      .sources-header.expanded i {
        transform: rotate(180deg);
      }

      .sources-list {
        display: none;
        flex-direction: column;
        gap: var(--space-2);
      }

      .sources-list.visible {
        display: flex;
      }

      .source-card {
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--color-border-light);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: border-color var(--transition-fast), background-color var(--transition-fast);
      }

      .source-card:hover {
        border-color: var(--color-border);
        background-color: var(--color-bg-tertiary);
      }

      .source-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
      }

      .source-title {
        font-size: var(--font-size-body-sm);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
        line-height: 1.4;
      }

      .source-score {
        font-size: var(--font-size-caption);
        color: var(--color-primary);
        font-weight: var(--font-weight-medium);
        background-color: var(--color-primary-50);
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .source-author {
        font-size: var(--font-size-caption);
        color: var(--color-text-tertiary);
        margin-top: 2px;
      }

      .source-excerpt {
        font-size: var(--font-size-caption);
        color: var(--color-text-secondary);
        margin-top: var(--space-2);
        line-height: var(--line-height-normal);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Source detail expand */
      .source-detail-panel {
        display: none;
        margin-top: var(--space-3);
        padding: var(--space-4);
        background-color: var(--color-bg-secondary);
        border-radius: var(--radius-md);
        border-left: 3px solid var(--color-primary);
      }
      .source-detail-panel.visible {
        display: block;
      }
      .source-detail-panel .detail-excerpt {
        font-size: var(--font-size-body-sm);
        color: var(--color-text-primary);
        line-height: var(--line-height-relaxed);
        margin-bottom: var(--space-3);
      }
      .source-detail-panel .detail-meta {
        display: flex;
        gap: var(--space-4);
        font-size: var(--font-size-caption);
        color: var(--color-text-tertiary);
        margin-bottom: var(--space-3);
      }
      .source-detail-panel .detail-collapse-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: var(--space-1) var(--space-3);
        border: none;
        background: transparent;
        color: var(--color-text-tertiary);
        font-size: var(--font-size-caption);
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: color var(--transition-fast), background-color var(--transition-fast);
      }
      .source-detail-panel .detail-collapse-btn:hover {
        color: var(--color-text-secondary);
        background-color: var(--color-bg-tertiary);
      }
      .source-detail-panel .detail-collapse-btn svg,
      .source-detail-panel .detail-collapse-btn i {
        width: 12px;
        height: 12px;
      }

      /* ============================================
         Message Action Buttons
         ============================================ */
      .msg-actions {
        display: flex;
        gap: var(--space-1);
        margin-top: var(--space-3);
        padding-top: var(--space-3);
        border-top: 1px solid var(--color-border-light);
        opacity: 0;
        transition: opacity var(--transition-fast);
      }
      .message-row:hover .msg-actions {
        opacity: 1;
      }
      .msg-action-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--color-text-tertiary);
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: all var(--transition-fast);
      }
      .msg-action-btn:hover {
        color: var(--color-text-secondary);
        background-color: var(--color-bg-tertiary);
      }
      .msg-action-btn svg,
      .msg-action-btn i {
        width: 15px;
        height: 15px;
      }

      /* ============================================
         Empty / Welcome state
         ============================================ */
      .welcome-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        max-width: 560px;
        width: 100%;
        text-align: center;
        flex: 1;
        margin: 0 auto;
      }

      .welcome-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        background-color: var(--color-primary);
        border-radius: 50%;
        margin-bottom: 20px;
        flex-shrink: 0;
      }

      .welcome-icon svg,
      .welcome-icon i {
        width: 24px;
        height: 24px;
        color: #FFFFFF;
      }

      .welcome-title {
        font-family: var(--font-family-title);
        font-size: 1.25rem;
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        margin-bottom: 8px;
        line-height: var(--line-height-tight);
      }

      .welcome-subtitle {
        font-size: var(--font-size-body-sm);
        color: var(--color-text-tertiary);
        line-height: var(--line-height-relaxed);
        max-width: 420px;
        margin-bottom: 32px;
      }


      /* ============================================
         Bottom Input Area
         ============================================ */
      .chat-input-area {
        flex-shrink: 0;
        padding: 0 24px 20px 24px;
        background-color: var(--color-bg);
      }

      .chat-input-wrapper {
        max-width: 780px;
        margin: 0 auto;
      }

      /* Mode switcher (segmented control) */
      .mode-switcher {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        margin-bottom: 8px;
      }

      .mode-tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 16px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background-color: transparent;
        color: var(--color-text-secondary);
        font-family: var(--font-family-body);
        font-size: 13px;
        font-weight: var(--font-weight-medium);
        cursor: pointer;
        transition: all var(--transition-fast);
        user-select: none;
        white-space: nowrap;
      }

      .mode-tab svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .mode-tab:hover {
        border-color: var(--color-border-dark);
        color: var(--color-text-primary);
      }

      .mode-tab.active {
        background-color: var(--color-primary);
        border-color: var(--color-primary);
        color: #FFFFFF;
      }

      .mode-tab.active:hover {
        background-color: var(--color-primary-light);
        border-color: var(--color-primary-light);
      }

      .mode-description {
        text-align: center;
        font-size: var(--font-size-caption);
        color: var(--color-text-tertiary);
        margin-bottom: 10px;
        line-height: 1.4;
      }

      /* ── Feature Toggle Pills ──────────────────────────── */
      .feature-toggles {
        display: flex;
        gap: 6px;
        padding: 0 2px;
        margin-right: auto;
      }
      .feature-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--color-border);
        border-radius: 14px;
        background: transparent;
        color: var(--color-text-tertiary);
        font-family: var(--font-family-body);
        font-size: 12px;
        font-weight: var(--font-weight-medium);
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
        white-space: nowrap;
      }
      .feature-pill svg,
      .feature-pill i {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
        transition: all 0.2s ease;
      }
      .feature-pill:hover {
        border-color: var(--color-border-dark);
        color: var(--color-text-secondary);
      }
      .feature-pill.active {
        border-color: var(--color-primary);
        color: var(--color-primary);
        background-color: var(--color-primary-50);
      }
      .feature-pill.active svg,
      .feature-pill.active i {
        color: var(--color-primary);
      }

      /* ── Thinking Process Panel (DeepSeek style) ────── */
      .thinking-process {
        display: none;
        margin-bottom: 12px;
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      .thinking-process.visible {
        display: block;
      }
      .thinking-process-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background-color: var(--color-bg-tertiary);
        cursor: pointer;
        user-select: none;
        transition: background-color 0.15s ease;
      }
      .thinking-process-header:hover {
        background-color: var(--color-bg-secondary);
      }
      .thinking-process-icon {
        width: 16px;
        height: 16px;
        color: var(--color-primary);
        flex-shrink: 0;
        animation: thinkPulse 1.5s ease-in-out infinite;
      }
      @keyframes thinkPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .thinking-process-label {
        font-size: 12px;
        color: var(--color-text-tertiary);
        font-weight: var(--font-weight-medium);
      }
      .thinking-process-duration {
        margin-left: auto;
        font-size: 11px;
        color: var(--color-text-tertiary);
        flex-shrink: 0;
      }
      .thinking-process-arrow {
        width: 14px;
        height: 14px;
        color: var(--color-text-tertiary);
        transition: transform 0.2s ease;
        flex-shrink: 0;
      }
      .thinking-process.open .thinking-process-arrow {
        transform: rotate(180deg);
      }
      .thinking-process-body {
        display: none;
        padding: 12px 16px;
        background-color: var(--color-bg-tertiary);
        border-top: 1px solid var(--color-border-light);
        font-size: var(--font-size-body-sm);
        color: var(--color-text-tertiary);
        line-height: 1.8;
        max-height: 320px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .thinking-process.open .thinking-process-body {
        display: block;
      }
      .thinking-process-body::-webkit-scrollbar {
        width: 4px;
      }
      .thinking-process-body::-webkit-scrollbar-thumb {
        background-color: var(--color-border);
        border-radius: 2px;
      }

      /* Search references panel */
      .search-references {
        display: none;
        margin-bottom: 12px;
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      .search-references.visible {
        display: block;
      }
      .search-ref-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;

<body>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // ── State ──────────────────────────────────────────
        let currentConversationId = null;
        let isStreaming = false;
        let abortController = null;
        let streamingConvId = null;  // 当前正在生成的对话 ID，用于切换检测

        // 检测用户是否切换了对话（生成期间）
        function isSwitchedAway() {
            return streamingConvId !== null && streamingConvId !== currentConversationId;
        }
        let currentMode = 'general';
        let thinkingMode = localStorage.getItem('thinking_mode') === 'true';
        let searchMode = false;
        let currentModel = null;        // the model id sent to the backend

        // ── Utility: HTML escaping ─────────────────────────
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ── Utility: Simple Markdown → HTML ────────────────
        // Configure marked for safe rendering
        marked.setOptions({
            breaks: true,       // GFM line breaks (single \n -> <br>)
            gfm: true,          // GitHub Flavored Markdown
            sanitize: false,    // We handle sanitization via DOM
        });

        function renderMarkdown(text) {
            if (!text) return '';
            return marked.parse(text);
        }

        function renderSettings(settings) {
            var grouped = {};
            settings.forEach(function(s) {
                var cat = s.category || 'general';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(s);
            });

            var html = '';
            Object.keys(grouped).forEach(function(cat) {
                if (cat === 'about') return;
                html += '<div class="settings-section"><h3 class="settings-section-title">' + (categoryLabels[cat] || cat) + '</h3>';
                grouped[cat].forEach(function(s) { html += renderSettingItem(s); });

            });

            // Stats + Cache
            html += '<div class="settings-section"><h3 class="settings-section-title">缓存与数据</h3>';
            html += '<div id="statsDisplay" style="padding:8px 0;font-size:var(--font-size-caption);color:var(--color-text-tertiary);"><p>加载知识库统计...</p></div>';
            html += '<div style="display:flex;gap:8px;margin-top:8px;">';
            html += '<button class="settings-action-btn" onclick="clearCache(\'embedding\')" style="flex:1;">清除嵌入缓存</button>';
            html += '<button class="settings-action-btn" onclick="clearCache(\'answer\')" style="flex:1;">清除回答缓存</button>';
            html += '</div></div>';

            // About
            html += '<div class="settings-section"><h3 class="settings-section-title">关于</h3>';
            html += '<div class="settings-about">';
            html += '<div class="settings-about-name">马列通</div>';
            html += '<div class="settings-about-desc">基于马克思主义经典著作的智能问答系统</div>';

        function renderSettingItem(s) {
            var v = s.value;
            var html = '<div class="settings-item" data-key="' + s.key + '">';
            html += '<div class="settings-item-label">' + s.label + '</div><div class="settings-item-control">';
            if (s.type === 'select') {
                html += '<select class="settings-select" onchange="updateSetting(\'' + s.key + '\',this.value)">';
                (s.options || []).forEach(function(opt) {
                    html += '<option value="' + opt + '"' + (opt === v ? ' selected' : '') + '>' + opt + '</option>';
                });
                html += '</select>';
            } else if (s.type === 'boolean') {
                var checked = v === 'true' || v === true;
                html += '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="updateSetting(\'' + s.key + '\',this.checked)">';
                html += '<span style="margin-left:6px;font-size:var(--font-size-caption);color:var(--color-text-tertiary);">' + s.description + '</span>';
            } else {
                html += '<input type="' + s.type + '" class="settings-input" value="' + escapeHtml(String(v)) + '" onchange="updateSetting(\'' + s.key + '\',this.value)">';
            }
            html += '</div>';
            if (s.description && s.type !== 'boolean') {
                html += '<div class="settings-item-desc">' + s.description + '</div>';
            }
            html += '</div>';
            return html;
        }

        async function updateSetting(key, value) {
            var payload = {};
            payload[key] = value;
            try {
                await fetch('/api/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ updates: payload }),
                });
                if (key === 'model' && value) {
                    var model = availableModels.find(function(m) { return m.id === value; });
                    if (model) selectModel(model);
                }
            } catch (e) { console.error('更新设置失败:', e); }
        }

            } catch (e) { el.innerHTML = '<p>加载统计失败</p>'; }
        }

        // ── Mode switcher ──────────────────────────────────

        // ── Model selector dropdown ────────────────────────

        function renderModelDropdown() {

        // ── Functions ──────────────────────────────────────

        function newChat() {
            currentConversationId = null;
            lastQuestion = '';
            welcomeContainer.style.display = 'flex';
            conversationContainer.innerHTML = '';
            conversationContainer.style.display = 'none';
            updateTimeline();
            textarea.value = '';
            textarea.dispatchEvent(new Event('input'));
            // Clear active history items
            document.querySelectorAll('.history-item').forEach(function(i) {
                i.classList.remove('active');
            });
            closeSidebar();
            textarea.focus();
        }

        function setStreamingUI(streaming) {
            isStreaming = streaming;
            if (streaming) {
                sendBtn.style.display = 'none';
                stopBtn.style.display = 'flex';
            } else {
                sendBtn.style.display = 'flex';
                stopBtn.style.display = 'none';
                textarea.disabled = false;
                sendBtn.disabled = false;
            }
        }

        async function sendMessage(options) {
            options = options || {};
            var question;
            if (options.skipUserMessage) {
                question = lastQuestion;
            } else {
                question = textarea.value.trim();
            }
            if (!question || isStreaming) return;

            lastQuestion = question;

            if (!options.skipUserMessage) {
                // Hide welcome, show conversation
                welcomeContainer.style.display = 'none';
                conversationContainer.style.display = 'block';

                // Add user message
                appendUserMessage(question);
                textarea.value = '';
                textarea.dispatchEvent(new Event('input'));
            }

            textarea.disabled = true;
            setStreamingUI(true);

            // Create assistant message placeholder
            var assistantRow = createAssistantMessageElement();
            var msgBubble = assistantRow.querySelector('.msg-bubble');
            var msgText = assistantRow.querySelector('.msg-text');

            // Create thinking process UI element
            var thinkingProcessEl = document.createElement('div');
            thinkingProcessEl.className = 'thinking-process';
            thinkingProcessEl.innerHTML = 
                '<div class="thinking-process-header">' +
                '<i data-lucide="brain" class="thinking-process-icon"></i>' +
                '<span class="thinking-process-label">正在深度思考...</span>' +
                '<span class="thinking-process-duration"></span>' +
                '<i data-lucide="chevron-down" class="thinking-process-arrow"></i>' +
                '</div>' +
                '<div class="thinking-process-body"></div>';
            
            thinkingProcessEl.querySelector('.thinking-process-header').addEventListener('click', function() {
                thinkingProcessEl.classList.toggle('open');
            });

            // Start thinking timer
            var thinkStartTime = Date.now();
            var thinkTimerEl = thinkingProcessEl.querySelector('.thinking-process-duration');
            var thinkTimerInterval = setInterval(function() {
                var elapsed = ((Date.now() - thinkStartTime) / 1000).toFixed(1);
                thinkTimerEl.textContent = elapsed + 's';
            }, 100);

            msgText.appendChild(thinkingProcessEl);

            // Create search references UI element
            var searchRefs = document.createElement('div');
            searchRefs.className = 'search-references';
            searchRefs.innerHTML = 
                '<div class="search-ref-header">' +
                '<i data-lucide="globe"></i>' +
                '<span>已搜索相关资料</span>' +
                '<i data-lucide="chevron-down" class="search-ref-arrow"></i>' +
                '</div>' +
                '<div class="search-ref-list"></div>';
            
            searchRefs.querySelector('.search-ref-header').addEventListener('click', function() {
                searchRefs.classList.toggle('open');
            });

            // Show a simple loading spinner instead of fake step animation
            var loadingEl = document.createElement('div');
            loadingEl.className = 'thinking-steps';
            loadingEl.innerHTML =
                '<div class="thinking-step active">' +
                    '<svg class="thinking-step-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>' +
                    '<span class="step-text">正在处理...</span>' +
                '</div>';
            msgText.appendChild(loadingEl);
            msgText.appendChild(searchRefs);

            conversationContainer.appendChild(assistantRow);
            scrollToBottom(true);

            var fullAnswer = '';
            var sourcesData = [];
            abortController = new AbortController();
            streamingConvId = currentConversationId;

            try {
                var response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        conversation_id: currentConversationId,
                        mode: currentMode,
                        model: currentModel,
                        thinking_mode: thinkingMode,
                        search_mode: searchMode,
                    }),
                    signal: abortController.signal,
                });

                if (!response.ok) {
                    throw new Error('API 请求失败: ' + response.status + ' ' + response.statusText);
                }

                var reader = response.body.getReader();
                var decoder = new TextDecoder();
                var buffer = '';
                var currentEvent = '';

                while (true) {
                    var result = await reader.read();
                    if (result.done) break;

                    // 如果用户在生成过程中切换了对话，跳过 DOM 更新
                    if (isSwitchedAway()) {
                        continue;
                    }

                    buffer += decoder.decode(result.value, { stream: true });
                    var lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i];

                        if (line.startsWith('event: ')) {
                            currentEvent = line.slice(7).trim();
                        } else if (line.startsWith('data: ')) {
                            var dataStr = line.slice(6).trim();
                            if (!dataStr) continue;

                            try {
                                var eventData = JSON.parse(dataStr);

                                // Handle thinking stream events
                                if (currentEvent === 'thinking' && eventData.content && thinkingMode) {
                                    thinkingProcessEl.classList.add('visible');
                                    var thinkBody = thinkingProcessEl.querySelector('.thinking-process-body');
                                    thinkBody.textContent += eventData.content;
                                } else if (currentEvent === 'thinking_done') {
                                    if (thinkingMode) {
                                        clearInterval(thinkTimerInterval);
                                        var thinkLabel = thinkingProcessEl.querySelector('.thinking-process-label');
                                        var thinkIcon = thinkingProcessEl.querySelector('.thinking-process-icon');
                                        var thinkDuration = thinkingProcessEl.querySelector('.thinking-process-duration');
                                        thinkLabel.textContent = '已深度思考';
                                        if (thinkIcon) thinkIcon.style.animation = 'none';
                                    }
                                } else if (currentEvent === 'search_result' && eventData.references) {
                                    if (searchMode && eventData.references.length) {
                                        searchRefs.classList.add('visible');
                                        var refList = searchRefs.querySelector('.search-ref-list');
                                        eventData.references.forEach(function(ref, idx) {
                                            var refItem = document.createElement('div');
                                            refItem.className = 'search-ref-item';
                                            refItem.innerHTML = '<span class="search-ref-idx">' + (idx + 1) + '</span>' +
                                                '<a href="' + escapeHtml(ref.url || '#') + '" target="_blank" rel="noopener">' + escapeHtml(ref.title || '参考来源') + '</a>';
                                            refList.appendChild(refItem);
                                        });
                                        lucide.createIcons();
                                    }
                                } else if (currentEvent === 'token' && eventData.content) {
                                    // Handle token - accumulate and re-render
                                    fullAnswer += eventData.content;
                                    if (loadingEl.parentNode) {
                                        loadingEl.remove();
                                    }
                                    // 节流：每 50ms 或满 200 字才重绘 markdown
                                    var now = Date.now();
                                    if (!msgText._lastRender || now - msgText._lastRender > 50 || fullAnswer.length - (msgText._lastRenderedLen || 0) > 200) {
                                        msgText.innerHTML = renderMarkdown(fullAnswer);
                                        msgText._lastRender = now;
                                        msgText._lastRenderedLen = fullAnswer.length;
                                        if (thinkingProcessEl) msgText.insertBefore(thinkingProcessEl, msgText.firstChild);
                                        if (searchRefs) msgText.insertBefore(searchRefs, msgText.firstChild);
                                        lucide.createIcons();
                                        scrollToBottom();
                                    }
                                } else if (currentEvent === 'done') {
                                    // Handle done event
                                    clearInterval(thinkTimerInterval);
                                    if (eventData.conversation_id) {
                                        currentConversationId = eventData.conversation_id;
                                    }
                                    sourcesData = eventData.sources || [];
                                    // Save thinking content to localStorage for persistence
                                    if (eventData.thinking_content && currentConversationId) {
                                        saveThinkingContent(currentConversationId, eventData.thinking_content);
                                    }
                                } else if (currentEvent === 'error') {
                                    if (loadingEl.parentNode) {
                                        loadingEl.textContent = '出错: ' + (eventData.detail || '未知错误');
                                    } else {
                                        msgText.innerHTML = '<p style="color: var(--state-error);">出错: ' + escapeHtml(eventData.detail || '未知错误') + '</p>';
                                    }
                                }
                            } catch (parseErr) {
                                // Ignore non-JSON lines (could be SSE comments or keep-alive)
                            }

                            // Reset currentEvent after processing data line
                            currentEvent = '';
                        }
                    }
                }

                // Remove loading indicator if still present
                if (loadingEl.parentNode) {
                    loadingEl.remove();
                }

                // If we have answer text, render final markdown
                if (fullAnswer) {
                    msgText.innerHTML = renderMarkdown(fullAnswer);
                    if (thinkingProcessEl) msgText.insertBefore(thinkingProcessEl, msgText.firstChild);
                    if (searchRefs) msgText.insertBefore(searchRefs, msgText.firstChild);
                    lucide.createIcons();
                }

                // Add sources if available
                if (sourcesData.length > 0) {
                    appendSources(assistantRow, sourcesData);
                }

                // Add action buttons for completed AI message
                appendMessageActions(assistantRow, fullAnswer);

                // Refresh history list
                loadHistory();

            } catch (err) {
                if (err.name === 'AbortError') {
                    // User cancelled - keep partial answer
                    if (loadingEl.parentNode) {
                        loadingEl.remove();
                    }
                    if (fullAnswer) {
                        msgText.innerHTML = renderMarkdown(fullAnswer);
                        if (thinkingProcessEl) msgText.insertBefore(thinkingProcessEl, msgText.firstChild);
                        if (searchRefs) msgText.insertBefore(searchRefs, msgText.firstChild);
                        appendMessageActions(assistantRow, fullAnswer);
                    } else {
                        msgText.innerHTML = '<p style="color: var(--color-text-tertiary);"><em>已停止生成</em></p>';
                    }
                } else {
                    if (loadingEl.parentNode) {
                        loadingEl.textContent = '出错: ' + err.message;
                    } else {
                        msgText.innerHTML = '<p style="color: var(--state-error);">出错: ' + escapeHtml(err.message) + '</p>';
                    }
                    console.error('Chat error:', err);
                }
            } finally {
                abortController = null;
                setStreamingUI(false);
                textarea.focus();
            }
        }

        // ── Message creation helpers ───────────────────────

        function appendUserMessage(content) {
            var row = document.createElement('div');
            row.className = 'message-row user-message';

            row.innerHTML =
                '<div class="msg-body">' +
                    '<div class="msg-bubble"><div class="msg-text"><p>' + escapeHtml(content) + '</p></div></div>' +
                '</div>';

            // Add edit button bar below user message (DeepSeek style)
            var actionsDiv = document.createElement('div');
            actionsDiv.className = 'user-msg-actions';

            var editBtn = document.createElement('button');
            editBtn.className = 'msg-action-btn';
            editBtn.type = 'button';
            editBtn.title = '编辑';
            editBtn.innerHTML = '<i data-lucide="pencil"></i>';
            editBtn.addEventListener('click', function() {
                editUserMessage(row, content);
            });

            actionsDiv.appendChild(editBtn);
            row.querySelector('.msg-body').appendChild(actionsDiv);

            // Store original text for re-editing
            setRowOriginalText(row, content);

            conversationContainer.appendChild(row);
            lucide.createIcons();
            scrollToBottom();
            updateTimeline();
            return row;
        }

        // Store original text on the row for re-editing
        function setRowOriginalText(row, text) {
            row.setAttribute('data-original-text', text);
        }

        function getRowOriginalText(row) {
            return row.getAttribute('data-original-text') || '';
        }

        // ── Vertical Timeline ──────────────────────────────
        var vTimeline = document.getElementById('vTimeline');
        var vTimelineDots = [];

        function updateTimeline() {
            vTimeline.innerHTML = '';
            vTimelineDots = [];

            var userRows = conversationContainer.querySelectorAll('.message-row.user-message');

            if (userRows.length === 0) {
                vTimeline.classList.remove('visible');
                return;
            }

            vTimeline.classList.add('visible');

            var label = document.createElement('div');
            label.className = 'v-timeline-label';
            label.textContent = '对话大纲';
            vTimeline.appendChild(label);

            userRows.forEach(function(row, index) {
                var text = getRowOriginalText(row) || '';

                var item = document.createElement('div');
                item.className = 'v-timeline-item';

                var dot = document.createElement('span');
                dot.className = 'v-timeline-dot';

                var textSpan = document.createElement('span');
                textSpan.className = 'v-timeline-text';
                textSpan.textContent = text;
                textSpan.title = text;

                item.appendChild(dot);
                item.appendChild(textSpan);

                item.addEventListener('click', function() {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });

                vTimeline.appendChild(item);
                vTimelineDots.push({ item: item, row: row });
            });
        }

        // Track active item on scroll
        chatMessages.addEventListener('scroll', function() {
            if (vTimelineDots.length === 0) return;

            var chatRect = chatMessages.getBoundingClientRect();
            var viewMid = chatRect.height / 2;

            var activeIdx = 0;
            for (var i = vTimelineDots.length - 1; i >= 0; i--) {
                var rowRect = vTimelineDots[i].row.getBoundingClientRect();
                var rowMid = rowRect.top - chatRect.top + rowRect.height / 2;
                if (rowMid <= viewMid) {
                    activeIdx = i;
                    break;
                }
            }

            vTimelineDots.forEach(function(o, idx) {
                o.item.classList.toggle('active', idx === activeIdx);
            });
        });

        // Restore a user message row to normal display mode with edit button
        function restoreUserMessageDisplay(row, text) {
            row.classList.remove('editing');
            var msgBody = row.querySelector('.msg-body');
            msgBody.innerHTML =
                '<div class="msg-bubble"><div class="msg-text"><p>' + escapeHtml(text) + '</p></div></div>';
            // Re-add edit button bar
            var actionsDiv = document.createElement('div');
            actionsDiv.className = 'user-msg-actions';
            var editBtn = document.createElement('button');
            editBtn.className = 'msg-action-btn';
            editBtn.type = 'button';
            editBtn.title = '编辑';
            editBtn.innerHTML = '<i data-lucide="pencil"></i>';
            editBtn.addEventListener('click', function() {
                editUserMessage(row, text);
            });
            actionsDiv.appendChild(editBtn);
            msgBody.appendChild(actionsDiv);
            lucide.createIcons();
        }

        // Edit a user message: enter editing mode, on submit truncate later messages and re-send
        function editUserMessage(row, originalContent) {
            if (isStreaming) return;

            var currentText = getRowOriginalText(row) || originalContent;
            row.classList.add('editing');

            var msgBubble = row.querySelector('.msg-bubble');
            msgBubble.innerHTML =
                '<div class="msg-text">' +
                    '<textarea class="msg-edit-area" placeholder="编辑消息...">' + escapeHtml(currentText) + '</textarea>' +
                    '<div class="msg-edit-actions">' +
                        '<button class="msg-edit-btn secondary" data-action="cancel">取消</button>' +
                        '<button class="msg-edit-btn primary" data-action="submit">' +
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>' +
                            '发送' +
                        '</button>' +
                    '</div>' +
                '</div>';

            var textarea = msgBubble.querySelector('.msg-edit-area');
            var cancelBtn = msgBubble.querySelector('[data-action="cancel"]');
            var submitBtn = msgBubble.querySelector('[data-action="submit"]');

            // Auto-resize textarea
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            textarea.addEventListener('input', function() {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
            });

            // Focus and select all
            textarea.focus();
            textarea.setSelectionRange(0, textarea.value.length);

            // Cancel: restore original display
            cancelBtn.addEventListener('click', function() {
                restoreUserMessageDisplay(row, currentText);
            });

            // Submit: truncate later messages, update text, re-send
            submitBtn.addEventListener('click', function() {
                var newText = textarea.value.trim();
                if (!newText) return;

                // Truncate all messages after this row
                truncateAfter(row);

                // Update this message's text
                setRowOriginalText(row, newText);
                restoreUserMessageDisplay(row, newText);

                // Re-send with the edited question
                // Reset conversation_id so backend starts fresh from the truncated point
                currentConversationId = null;
                lastQuestion = newText;
                sendMessage({skipUserMessage: true});
            });

            // Enter to submit (Shift+Enter for newline)
            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    submitBtn.click();
                }
                if (e.key === 'Escape') {
                    cancelBtn.click();
                }
            });
        }

        // Remove all message rows after the given row (DeepSeek-style truncation)
        function truncateAfter(row) {
            var allRows = Array.from(conversationContainer.querySelectorAll('.message-row'));
            var idx = allRows.indexOf(row);
            if (idx === -1) return;

            // Remove everything after this row
            for (var i = allRows.length - 1; i > idx; i--) {
                allRows[i].remove();
            }
            updateTimeline();
        }

        function appendSources(messageRow, sources) {
            var msgBody = messageRow.querySelector('.msg-body');

            if (existing) existing.remove();

            var sourcesSection = document.createElement('div');
            sourcesSection.className = 'sources-section';

            // Header (toggle)
            var header = document.createElement('div');
            header.className = 'sources-header expanded';
            header.setAttribute('aria-expanded', 'true');
            header.innerHTML =
                '<span class="sources-header-label">参考来源 (' + sources.length + ')</span>' +
                '<i data-lucide="chevron-down"></i>';
            sourcesSection.appendChild(header);

            // List
            var list = document.createElement('div');
            list.className = 'sources-list visible';

            sources.forEach(function(s) {
                var card = document.createElement('div');
                card.className = 'source-card';

                var score = parseFloat(s.score) || 0;

                var headerDiv = document.createElement('div');
                headerDiv.className = 'source-card-header';

                var titleDiv = document.createElement('div');
                titleDiv.className = 'source-title';
                titleDiv.textContent = s.title || '未知来源';

                var scoreSpan = document.createElement('span');
                scoreSpan.className = 'source-score';
                scoreSpan.textContent = score.toFixed(2);

                headerDiv.appendChild(titleDiv);
                headerDiv.appendChild(scoreSpan);
                card.appendChild(headerDiv);

                if (s.author) {
                    var authorDiv = document.createElement('div');
                    authorDiv.className = 'source-author';
                    authorDiv.textContent = s.author;
                    card.appendChild(authorDiv);
                }

                if (s.excerpt) {
                    var excerptDiv = document.createElement('div');
                    excerptDiv.className = 'source-excerpt';
                    excerptDiv.textContent = s.excerpt;
                    card.appendChild(excerptDiv);
                }

                // Click to expand detail

                    toggleSourceDetail(card, s);
                });

                list.appendChild(card);
            });

            sourcesSection.appendChild(list);
            msgBody.appendChild(sourcesSection);

            // Toggle collapse/expand
            header.addEventListener('click', function() {
                var isVisible = list.classList.toggle('visible');
                header.classList.toggle('expanded', isVisible);
                header.setAttribute('aria-expanded', isVisible ? 'true' : 'false');
            });

            lucide.createIcons();

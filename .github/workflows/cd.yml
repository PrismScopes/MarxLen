# MarxLen 持续交付 —— 打 tag 自动发版
#
# 触发条件:推送形如 v1.2.3 的 tag。
# 流程:
#   1. 跑全部零依赖测试(与 CI 同一套,作为发布门禁);
#   2. 构建 Docker 镜像并推送到 GitHub Container Registry (ghcr.io);
#   3. 自动创建 GitHub Release(附代码变更摘要)。
#
# 注意:
#   - deploy/ 目录(install.ps1、MarxLen.exe 等)不入库,由作者在
#     Release 页手动上传 deploy-scripts.zip / MarxLen.exe 附件;
#   - 知识库三件套(约 1.16GB)不随镜像打包,通过 docker-compose
#     挂载或 Releases 单独分发。
#
# 用法:git tag v1.2.3 && git push origin v1.2.3

name: CD 发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # 创建 Release
  packages: write        # 推送 ghcr.io 镜像

jobs:
  test:
    name: 发布门禁(测试)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 uv
        run: pip install uv

      - name: 安装依赖
        working-directory: rag
        run: uv sync --frozen --no-install-project

      - name: 运行全部测试
        working-directory: rag
        run: uv run python ../tests/run_all.py

      - name: 前端 ES module 检查
        run: node --experimental-vm-modules tests/check_frontend.mjs

  docker:
    name: 构建并推送 Docker 镜像
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/prismscopes/marxlen
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: 创建 GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码(取 CHANGELOG 与 tag 信息)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成变更摘要
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
          else
            RANGE=""
          fi
          {
            echo "## 镜像"
            echo "Docker 镜像已推送: \`ghcr.io/prismscopes/marxlen:$TAG\` 与 \`latest\`"
            echo ""
            if [ -n "$RANGE" ]; then
              echo "## 自 $PREV 以来的提交"
              echo '```'
              git log --oneline --no-merges "$RANGE" | head -50
              echo '```'
            fi
          } > release_notes.md
          echo "notes_path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.notes_path }}
          draft: true     # 草稿:作者核对后手动发布并补传 deploy 附件
          generate_release_notes: false
          fail_on_unmatched_files: true
